<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Student Scheduler</title>
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
    </form>

    <p class="auth-links"><a href="login.html">Back to log in</a></p>
  </div>
</div>
<script type="module" src="/src/auth/forgot-password.js"></script>
</body>
</html>
