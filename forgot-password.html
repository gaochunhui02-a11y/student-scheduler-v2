<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Student Scheduler</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#10131a">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/v3.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="auth.forgotTitle">Forgot your password?</h1>
    <p class="subtitle" data-i18n="auth.forgotSubtitle">Enter your email and we'll send you a reset link.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <form id="forgotForm">
      <label for="email" data-i18n="auth.email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <button type="submit" class="btn-primary" id="submitBtn" data-i18n="auth.sendResetLink">Send Reset Link</button>
    </form>

    <p class="auth-links"><a href="login.html" data-i18n="auth.backToLogin">Back to log in</a></p>
  </div>
</div>
<script type="module" src="/src/auth/forgot-password.js"></script>
</body>
</html>
