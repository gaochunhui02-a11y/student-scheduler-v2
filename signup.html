<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Student Scheduler</title>
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Plan your day, saved to your own account.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <form id="signupForm">
      <label for="name">Name</label>
      <input type="text" id="name" required autocomplete="name">

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="6">

      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">

      <button type="submit" class="btn-primary" id="submitBtn">Sign Up</button>
    </form>

    <p class="auth-links">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script type="module" src="/src/auth/signup.js"></script>
</body>
</html>
