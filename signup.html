<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Student Scheduler</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#10131a">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/v3.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="auth.signupTitle">Create your account</h1>
    <p class="subtitle" data-i18n="auth.signupSubtitle">Plan your day, saved to your own account.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <form id="signupForm">
      <label for="name" data-i18n="auth.name">Name</label>
      <input type="text" id="name" required autocomplete="name">

      <label for="email" data-i18n="auth.email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password" data-i18n="auth.password">Password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="6">

      <label for="confirmPassword" data-i18n="auth.confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">

      <button type="submit" class="btn-primary" id="submitBtn" data-i18n="auth.signUpButton">Sign Up</button>
    </form>

    <p class="auth-links"><span data-i18n="auth.haveAccount">Already have an account?</span> <a href="login.html" data-i18n="auth.logInLink">Log in</a></p>
    <div class="auth-demo">
      <a class="auth-demo-link" href="/dashboard.html?demo=1#/home" data-i18n="demo.tryDemo">Explore the demo</a>
      <p class="auth-demo-hint" data-i18n="demo.tryDemoHint">No account needed — sample data only.</p>
    </div>
  </div>
</div>
<script type="module" src="/src/auth/signup.js"></script>
</body>
</html>
