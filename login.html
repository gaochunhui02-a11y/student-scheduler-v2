<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Student Scheduler</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#10131a">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/v3.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="auth.loginTitle">Log in</h1>
    <p class="subtitle" data-i18n="auth.loginSubtitle">Welcome back to your Student Scheduler.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <form id="loginForm">
      <label for="email" data-i18n="auth.email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password" data-i18n="auth.password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn-primary" id="submitBtn" data-i18n="auth.logInButton">Log In</button>
    </form>

    <p class="auth-links"><a href="forgot-password.html" data-i18n="auth.forgotPassword">Forgot password?</a></p>
    <p class="auth-links"><span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" data-i18n="auth.signUpLink">Sign up</a></p>
    <div class="auth-demo">
      <a class="auth-demo-link" href="/dashboard.html?demo=1#/home" data-i18n="demo.tryDemo">Explore the demo</a>
      <p class="auth-demo-hint" data-i18n="demo.tryDemoHint">No account needed — sample data only.</p>
    </div>
  </div>
</div>
<script type="module" src="/src/auth/login.js"></script>
</body>
</html>
