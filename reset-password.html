<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Student Scheduler</title>
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="subtitle" id="subtitleText">Checking your reset link…</p>

    <div class="msg error" id="errorMsg"></div>

    <form id="resetForm" style="display:none;">
      <label for="password">New password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="6">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">

      <button type="submit" class="btn-primary" id="submitBtn">Reset Password</button>
    </form>

    <p class="auth-links"><a href="forgot-password.html">Request a new reset link</a></p>
  </div>
</div>
<script type="module" src="/src/auth/reset-password.js"></script>
</body>
</html>
