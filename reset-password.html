<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Student Scheduler</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#4f56d3">
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="auth.resetTitle">Choose a new password</h1>
    <p class="subtitle" id="subtitleText" data-i18n="auth.checkingResetLink">Checking your reset link…</p>

    <div class="msg error" id="errorMsg"></div>

    <form id="resetForm" style="display:none;">
      <label for="password" data-i18n="auth.newPassword">New password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="6">

      <label for="confirmPassword" data-i18n="auth.confirmNewPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">

      <button type="submit" class="btn-primary" id="submitBtn" data-i18n="auth.resetPasswordButton">Reset Password</button>
    </form>

    <p class="auth-links"><a href="forgot-password.html" data-i18n="auth.requestNewResetLink">Request a new reset link</a></p>
  </div>
</div>
<script type="module" src="/src/auth/reset-password.js"></script>
</body>
</html>
